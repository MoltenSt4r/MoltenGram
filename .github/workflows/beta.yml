name: Beta build

on:
  push:
    branches:
      - beta
      - 'beta-*'
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/beta.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Post the APK to the Telegram channel'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Gradle Build
    runs-on: ubuntu-latest
    outputs:
      build_timestamp: ${{ steps.beta_build_step.outputs.build_timestamp }}
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      NATIVE_TARGET: "universal"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force || true
          df -h
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Point Chaquopy at that Python
        run: echo "CHAQUOPY_BUILD_PYTHON=$(which python3.11 || which python)" >> $GITHUB_ENV
      - name: Set up Ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: android-ndk
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-37.0 cmake;3.31.6"
      - name: Install Native Build Dependencies
        run: |
          which nasm || {
            sudo apt-get update
            sudo apt-get install --no-install-recommends --yes nasm
          }
      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
      - name: Modify Gradle JVM Args
        run: |
          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
          echo "Detected memory size: ${MEMORY_GB}GB"
          if [ $MEMORY_GB -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi
          cat gradle.properties
      - name: Restore signing key
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [ -n "$RELEASE_KEYSTORE" ]; then
            echo "$RELEASE_KEYSTORE" | base64 -d > TMessagesProj/release.keystore
            echo "signing key restored from secrets"
          else
            echo "using repository release keystore"
          fi
          ls -la TMessagesProj/release.keystore
      - name: Beta Build
        id: beta_build_step
        env:
          COMMIT_ID: ${{ github.sha }}
        run: |
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          export BUILD_TIMESTAMP=$(date +%s)
          echo "build_timestamp=$BUILD_TIMESTAMP" >> "$GITHUB_OUTPUT"
          export NATIVE_TARGET=arm64-v8a
          ./gradlew TMessagesProj:assembleStaging -PSTAGING_CODENAME=StarAnise
      - name: Upload arm64-v8a Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Beta-StarAnise
          path: |
            TMessagesProj/build/outputs/apk/staging/*.apk

      - name: Create Beta Pre-Release
        uses: softprops/action-gh-release@v2
        if: ${{ success() && !contains(github.event.head_commit.message, '[skip publish]') }}
        with:
          tag_name: v13.2.1-beta-staranise
          target_commitish: ${{ github.sha }}
          name: MoltenGram v13.2.1 Beta «StarAnise»
          prerelease: true
          make_latest: false
          body: |
            ### ✨ MoltenGram v13.2.1 Beta «StarAnise»

            **Вход по токену бота:**
            - Отдельное окно редактирования профиля бота (имя, описание «О боте», описание «Что умеет этот бот?» с выбором языка, загрузка и удаление аватарки, копирование `@username`, просмотр баннера описания)
            - Кнопка **Live-печати** (`SendMessageTextDraftAction`) в поле ввода личных чатов с живым стримингом набираемого текста

            **Liquid Glass и интерфейс:**
            - Исправлен сброс тонизации Liquid Glass при выключении и доработано отображение мини-плеера и волнистой шкалы аудиосообщений
            - Исправлено переключение и сохранение тёмных/дневных тем чата и локальных обоев без глобального сброса темы
            - Добавлен скрытый профиль и синхронизация бесплатных эмодзи-статусов через скрытые теги и бота-синхронизатора
          files: |
            TMessagesProj/build/outputs/apk/staging/*.apk

      - name: Send APK to Telegram
        continue-on-error: true
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.publish) && !contains(github.event.head_commit.message, '[skip publish]') }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID || '39205442' }}
          TG_API_HASH: ${{ secrets.TG_API_HASH || '1090b570704d1d97975994ee9c177dba' }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RELEASE_TITLE: "MoltenGram v13.2.1 Beta «StarAnise»"
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          APK_GLOB: "TMessagesProj/build/outputs/apk/staging/*.apk"
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "секреты Telegram (TG_BOT_TOKEN или TG_CHAT_ID) не заданы — отправка пропущена"
            exit 0
          fi
          pip install --quiet kurigram tgcrypto
          python3 .github/scripts/send_apk.py
