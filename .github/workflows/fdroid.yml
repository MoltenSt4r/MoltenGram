name: Update F-Droid Repository

# Auto-sync trigger for release v12.10.6
on:
  workflow_run:
    workflows: ["Release Build"]
    types:
      - completed
  release:
    types: [published]
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fdroid.yml'
      - '.github/fdroid/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build F-Droid repo for (e.g. v12.10.6)'
        required: false
        default: 'v12.10.6'

permissions:
  contents: write

concurrency:
  group: "fdroid-repo"
  cancel-in-progress: true

jobs:
  fdroid:
    name: Build & Publish F-Droid Repository
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clean intermediate GitHub Release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name || 'v12.10.6' }}
        run: |
          python3 << 'EOF'
          import json, os, urllib.request

          repo = "${{ github.repository }}"
          token = os.environ.get("GITHUB_TOKEN", "")
          tag = os.environ.get("TAG", "v12.10.6")

          headers = {
              "Authorization": f"token {token}",
              "Accept": "application/vnd.github.v3+json",
              "User-Agent": "release-cleaner",
          }

          url = f"https://api.github.com/repos/{repo}/releases/tags/{tag}"
          print(f"Fetching release: {url}")
          req = urllib.request.Request(url, headers=headers)
          try:
              with urllib.request.urlopen(req) as resp:
                  data = json.loads(resp.read().decode())
          except Exception as e:
              print(f"Could not fetch release: {e}")
              exit(0)

          # Update release metadata if needed
          release_id = data.get("id")
          if release_id:
              patch_data = json.dumps({
                  "tag_name": tag,
                  "name": f"MoltenGram {tag}",
                  "make_latest": "true",
              }).encode("utf-8")
              patch_req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/releases/{release_id}",
                  data=patch_data,
                  headers={**headers, "Content-Type": "application/json"},
                  method="PATCH",
              )
              try:
                  with urllib.request.urlopen(patch_req) as presp:
                      print("Updated release metadata to latest.")
              except Exception as e:
                  print(f"Patch metadata note: {e}")

          assets = data.get("assets", [])
          print(f"Total assets found: {len(assets)}")
          apk_assets = [a for a in assets if a.get("name", "").endswith(".apk")]
          apk_assets.sort(key=lambda a: a.get("updated_at", a.get("created_at", "")), reverse=True)

          if apk_assets:
              latest_apk = apk_assets[0]
              print(f"Latest official release asset to preserve: {latest_apk.get('name')}")
              for a in apk_assets[1:]:
                  name = a.get("name", "")
                  asset_id = a.get("id")
                  print(f"Deleting older/superseded asset: {name} (ID {asset_id})...")
                  del_req = urllib.request.Request(
                      f"https://api.github.com/repos/{repo}/releases/assets/{asset_id}",
                      headers=headers,
                      method="DELETE",
                  )
                  try:
                      with urllib.request.urlopen(del_req) as del_resp:
                          print(f"Successfully deleted {name}")
                  except Exception as err:
                      print(f"Failed to delete {name}: {err}")
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install fdroidserver
        run: pip install fdroidserver pillow

      - name: Build F-Droid repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name || 'v12.10.6' }}
        run: |
          set -ex

          # Ensure Android SDK build-tools are in PATH for aapt
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -d "$ANDROID_HOME/build-tools" ]; then
            LATEST_BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
            export PATH="$LATEST_BUILD_TOOLS:$PATH"
          fi

          # Create fdroid workspace
          mkdir -p fdroid_ws/repo fdroid_ws/metadata

          # Copy MoltenGram release keystore (PKCS12)
          cp TMessagesProj/release.keystore fdroid_ws/keystore.p12

          # Copy complete metadata tree (including localized icons)
          if [ -d .github/fdroid/metadata ]; then
            cp -r .github/fdroid/metadata/* fdroid_ws/metadata/
          fi

          # Write config.yml manually (no fdroid init)
          cat > fdroid_ws/config.yml << CFGEOF
          repo_url: "https://moltenst4r.github.io/MoltenGram/fdroid/repo"
          repo_name: "MoltenGram F-Droid Repository"
          repo_description: "Official F-Droid repository for MoltenGram"
          archive_older: 0
          keystore: keystore.p12
          keystorepass: android
          repo_keyalias: moltengram
          keypass: android
          keydname: "CN=MoltenGram, OU=MoltenStar, O=MoltenStar, L=Unknown, ST=Unknown, C=RU"
          sdk_path: "$ANDROID_HOME"
          CFGEOF
          chmod 0600 fdroid_ws/config.yml

          # Download APK from GitHub Release
          echo "Downloading APK for release $TAG..."
          cd fdroid_ws

          python3 << 'PYEOF'
          import json, urllib.request, os
          repo = "${{ github.repository }}"
          tag = os.environ.get("TAG", "v12.10.6")
          url = f"https://api.github.com/repos/{repo}/releases/tags/{tag}"
          print(f"Fetching release info: {url}")
          headers = {"User-Agent": "fdroid-builder"}
          token = os.environ.get("GITHUB_TOKEN", "")
          if token:
              headers["Authorization"] = f"token {token}"
          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req) as resp:
              data = json.loads(resp.read().decode())
          assets = data.get("assets", [])
          apk_assets = [a for a in assets if a.get("name", "").endswith(".apk")]
          apk_assets.sort(key=lambda a: a.get("updated_at", a.get("created_at", "")), reverse=True)
          if not apk_assets:
              raise RuntimeError(f"No APK assets in release {tag}")
          latest_asset = apk_assets[0]
          name = latest_asset["name"]
          dl = latest_asset["browser_download_url"]
          print(f"Downloading latest release APK: {name}...")
          urllib.request.urlretrieve(dl, f"repo/{name}")
          sz = os.path.getsize(f"repo/{name}")
          print(f"  -> {sz} bytes")
          PYEOF

          ls -lh repo/

          # Build repo index
          fdroid update --create-metadata --verbose 2>&1 || {
            echo "=== fdroid update failed, dumping config ==="
            cat config.yml
            ls -la
            ls -la repo/
            exit 1
          }

          echo "F-Droid repo built successfully"
          ls -la repo/

      - name: Deploy to GitHub Pages
        run: |
          mkdir -p deploy/fdroid
          cp -r fdroid_ws/repo deploy/fdroid/
          touch deploy/.nojekyll deploy/fdroid/.nojekyll

          cat > deploy/robots.txt << 'EOF'
          User-agent: *
          Allow: /

          Sitemap: https://moltenst4r.github.io/MoltenGram/sitemap.xml
          EOF

          cat > deploy/sitemap.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://moltenst4r.github.io/MoltenGram/</loc>
              <changefreq>weekly</changefreq>
              <priority>0.8</priority>
            </url>
          </urlset>
          EOF

          cat > deploy/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="ru">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>MoltenGram • Telegram с Material Design 3</title>
            <meta name="description" content="MoltenGram — свободный Android-клиент Telegram на базе Exteraless с Material Design 3. Официальный репозиторий F-Droid и загрузка.">
            <meta name="robots" content="index, follow">
            <link rel="canonical" href="https://www.moltenstar.space/">
            <meta http-equiv="refresh" content="0;url=https://www.moltenstar.space/#moltengram">
            <script>window.location.replace("https://www.moltenstar.space/#moltengram");</script>
          </head>
          <body>
            <p>Перенаправление на <a href="https://www.moltenstar.space/#moltengram">moltenstar.space</a>...</p>
          </body>
          </html>
          EOF

          cat > deploy/fdroid/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="ru">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>MoltenGram F-Droid Repository</title>
            <meta name="description" content="Официальный F-Droid репозиторий MoltenGram для автоматического обновления Android-клиента.">
            <meta name="robots" content="index, follow">
            <link rel="canonical" href="https://www.moltenstar.space/#fdroid">
            <meta http-equiv="refresh" content="0;url=https://www.moltenstar.space/#fdroid">
            <script>window.location.replace("https://www.moltenstar.space/#fdroid");</script>
          </head>
          <body>
            <p>Перенаправление на <a href="https://www.moltenstar.space/#fdroid">moltenstar.space</a>...</p>
          </body>
          </html>
          EOF

      - name: Push to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: deploy
          clean: true
          single-commit: true
