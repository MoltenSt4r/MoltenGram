name: Release Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/**'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Post the APK to the Telegram channel'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Gradle Build
    runs-on: ubuntu-latest
    outputs:
      build_timestamp: ${{ steps.release_build_step.outputs.build_timestamp }}
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      NATIVE_TARGET: "universal"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force || true
          df -h
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Point Chaquopy at that Python
        run: echo "CHAQUOPY_BUILD_PYTHON=$(which python3.11 || which python)" >> $GITHUB_ENV
      - name: Set up Ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: android-ndk
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-37.0 cmake;3.31.6"
      - name: Install Native Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nasm
      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
      - name: Modify Gradle JVM Args
        run: |
          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
          echo "Detected memory size: ${MEMORY_GB}GB"
          if [ $MEMORY_GB -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi
          cat gradle.properties
      - name: Restore signing key
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [ -n "$RELEASE_KEYSTORE" ]; then
            echo "$RELEASE_KEYSTORE" | base64 -d > TMessagesProj/release.keystore
            echo "signing key restored from secrets"
          else
            echo "using repository release keystore"
          fi
          ls -la TMessagesProj/release.keystore
          echo "Verifying keystore:"
          keytool -list -v -keystore TMessagesProj/release.keystore -storepass android || openssl pkcs12 -in TMessagesProj/release.keystore -passin pass:android -nodes | openssl x509 -text -noout
      - name: Release Build
        id: release_build_step
        env:
          COMMIT_ID: ${{ github.event.head_commit.id }}
        run: |
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          export BUILD_TIMESTAMP=$(date +%s)
          echo "build_timestamp=$BUILD_TIMESTAMP" >> "$GITHUB_OUTPUT"
          export NATIVE_TARGET=arm64-v8a
          ./gradlew TMessagesProj:assembleRelease
      - name: Upload arm64-v8a Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Release
          path: |
            TMessagesProj/build/outputs/apk/release/*.apk
      - name: Clean up legacy test builds
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: 'test-build'
              });
              if (release && release.data) {
                console.log('Deleting test-build release ID:', release.data.id);
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.data.id
                });
              }
            } catch (e) {
              console.log('No test-build release to delete');
            }
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: ${{ success() }}
        with:
          tag_name: v12.10.6
          name: MoltenGram v12.10.6
          make_latest: true
          body: |
            ### 🔥 Релиз MoltenGram v12.10.6

            **🎨 Интерфейс и Material 3:**
            - **Карусель медиа (Media Carousel):** группы фото и видео теперь могут отображаться в виде плавной горизонтальной карусели карточек вместо классической сетки.
            - **Исправление бабла карусели:** убрано лишнее пустое пространство снизу сообщения, границы фона подогнаны точно под карточки медиа, подпись, реакции и кнопку комментариев.
            - **Material 3 Video Seekbar:** нативный современный ползунок перемотки видео в стиле Material You.
            - **Формы аватарок:** раздельная настройка форм аватаров (Squircle, Rounded, скругления) для пользователей, групп и каналов.
            - **Папки-чипсы Material 3:** кастомизация панели папок чатов со стилями (Filled, Outlined, Ghost), плавным морфингом скруглений и анимациями.
            - **Анимации ввода текста:** плавный курсор, эффекты размытия и частицы при удалении.
            - **Свежие иконки:** обновленный выбор иконок лаунчера (MoltenGram, Beer, Magma, Holo, Neon, Cyber и др.) и адаптивные монохромные иконки под Nothing OS и Google Pixel.

            **🎵 Музыкальный плеер и видео:**
            - Экран воспроизведения аудио в стиле MetroList с удобным жестовым управлением.
            - Синхронизированные тексты песен (Lyrics) из множества источников с drag-and-drop приоритизацией провайдеров.
            - Ползунок скорости воспроизведения и стабильная работа фонового аудиосервиса.

            **🧩 Плагины и кастомизация:**
            - **Встроенный Plugin Store:** каталог дополнений прямо в клиенте с установкой и обновлением в один клик.
            - Прямой импорт Python-скриптов (`.py`) с автоконвертацией в `.plugin`.
            - Пакетное резервное копирование и восстановление плагинов со всеми настройками и правами.

            **⚡ Производительность и связь:**
            - **Интеграция с Shizuku:** бесшовное обновление приложения без системных запросов.
            - **Fastest Proxy:** автоматическое тестирование пинга и подключение к самому быстрому прокси-серверу.
            - **AI-инструменты:** быстрые саммари чатов и распознавание голосовых сообщений (Groq Whisper, Requesty).
            - **Passkey:** быстрая и безопасная авторизация по ключам доступа.
            - Обновление базы Telegram до официальной версии **12.10.6**.
            - Чистая цифровая подпись APK (схемы v1, v2, v3).
          files: TMessagesProj/build/outputs/apk/release/*.apk
      - name: Send APK to Telegram
        continue-on-error: true
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.publish) && !contains(github.event.head_commit.message, '[skip publish]') }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID || '39205442' }}
          TG_API_HASH: ${{ secrets.TG_API_HASH || '1090b570704d1d97975994ee9c177dba' }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          APK_GLOB: "TMessagesProj/build/outputs/apk/release/*.apk"
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "секреты Telegram (TG_BOT_TOKEN или TG_CHAT_ID) не заданы — отправка пропущена"
            exit 0
          fi
          pip install --quiet kurigram tgcrypto
          python3 .github/scripts/send_apk.py

      - name: Trigger F-Droid Repository Update
        if: ${{ always() && steps.release_build_step.outcome == 'success' }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Обновление отдельного репозитория MoltenSt4r/fdroid через GH_PAT
          if [ -n "$GH_PAT" ]; then
            echo "Отправка repository_dispatch в MoltenSt4r/fdroid..."
            curl -s -X POST \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Authorization: token $GH_PAT" \
              https://api.github.com/repos/MoltenSt4r/fdroid/dispatches \
              -d '{"event_type": "update-repo"}' || true
          fi
          # 2. Диспатч локального workflow fdroid.yml
          TOKEN="${GH_PAT:-$GITHUB_TOKEN}"
          curl -s -X POST -H "Authorization: token $TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/fdroid.yml/dispatches \
            -d '{"ref":"main","inputs":{"tag":"v12.10.6"}}' || true
